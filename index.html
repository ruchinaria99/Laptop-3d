<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interactive 3D laptop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap">
<style>
  :root {
    --page: #f4f5f7;
    --ink: #1d2229;
    --ring: rgba(29, 34, 41, 0.28);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #15171b;
      --ink: #e8ebef;
      --ring: rgba(232, 235, 239, 0.34);
    }
  }
  :root[data-theme="dark"] {
    --page: #15171b;
    --ink: #e8ebef;
    --ring: rgba(232, 235, 239, 0.34);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    height: 100%;
    background: var(--page);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* sky layer: behind everything, never takes clicks */
  .clouds {
    --band: max(30vh, 200px);
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .clouds .band, .clouds .grain {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: calc(var(--band) * 1.7);
    overflow: hidden;
    /* a long, eased fade so the sky melts into the page with no visible edge */
    --fade: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.93) 16%, rgba(0,0,0,0.78) 30%, rgba(0,0,0,0.56) 44%,
            rgba(0,0,0,0.34) 58%, rgba(0,0,0,0.17) 71%, rgba(0,0,0,0.06) 84%, transparent 100%);
    -webkit-mask-image: var(--fade);
            mask-image: var(--fade);
  }
  .clouds .sky, .clouds .stars { position: absolute; inset: 0; }
  .clouds .stars { opacity: 0; }
  .clouds .stars canvas { position: absolute; inset: 0; width: 100%; height: 100%; animation: twinkle 3.4s ease-in-out infinite alternate; }
  .clouds .stars canvas:nth-child(2) { animation-duration: 4.7s; animation-delay: -1.3s; }
  .clouds .stars canvas:nth-child(3) { animation-duration: 6.1s; animation-delay: -2.9s; }
  @keyframes twinkle { from { opacity: 1; } to { opacity: 0.45; } }
  .clouds .moon {
    position: absolute;
    top: 7%; right: 9%;
    width: clamp(22px, 2.6vw, 34px);
    aspect-ratio: 1;
    border-radius: 50%;
    box-shadow: inset -0.2em 0.12em 0 0 #f6f8fb;
    font-size: clamp(22px, 2.6vw, 34px);
    transform: rotate(-18deg);
    filter: drop-shadow(0 0 6px rgba(214, 226, 255, 0.55));
    opacity: 0;
  }
  .clouds .sun { position: absolute; top: 0; left: 0; width: min(60vw, calc(var(--band) * 1.7)); aspect-ratio: 1; opacity: 0; }
  .clouds .sun i { position: absolute; inset: 0; }
  .clouds .sun .glare {
    background: radial-gradient(circle at 0 0, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.55) 10%, rgba(255,255,255,0.18) 26%, rgba(255,255,255,0) 50%);
  }
  .clouds .sun .rays {
    background: repeating-conic-gradient(from 92deg at 0 0, rgba(255,255,255,0.13) 0deg 3deg, rgba(255,255,255,0) 3deg 9deg, rgba(255,255,255,0.07) 9deg 10.5deg, rgba(255,255,255,0) 10.5deg 17deg);
    -webkit-mask-image: radial-gradient(circle at 0 0, #000 0%, transparent 68%);
            mask-image: radial-gradient(circle at 0 0, #000 0%, transparent 68%);
    filter: blur(3px);
  }
  .clouds #cloud-gl {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: calc(var(--band) * 2.3);   /* the band, plus room below it for the cloud shadows */
    display: block;
  }
  .clouds .grain { opacity: 0; mix-blend-mode: overlay; }
  @media (prefers-reduced-motion: reduce) {
    .clouds .stars canvas { animation: none; }
  }

  .preview {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 0.75rem);
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    gap: 2px;
    padding: 3px;
    border-radius: 999px;
    background: var(--page);
    box-shadow: 0 0 0 1px var(--ring);
  }
  .preview button {
    border: 0; background: none; color: inherit; cursor: pointer;
    font: inherit; font-size: 0.8125rem; line-height: 1;
    padding: 0.5rem 0.7rem;
    border-radius: 999px;
  }
  .preview button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
  .preview button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .stage {
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    align-self: stretch;
    min-height: 320px;
    touch-action: none;
    cursor: grab;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .stage[data-dragging="true"] { cursor: grabbing; }
  .stage:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 4px;
    border-radius: 12px;
  }
  .stage canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
  }
  .hint {
    position: absolute; left: 0; right: 0; bottom: 4.25rem;
    text-align: center;
    font-size: 0.8125rem;
    letter-spacing: 0.01em;
    opacity: 0.6;
    pointer-events: none;
    transition: opacity 600ms ease;
  }
  .hint[data-hidden="true"] { opacity: 0; }
  .fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 1rem; }

  .weather {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 1rem);
    right: 1rem;
    z-index: 2;
    display: flex; flex-direction: column; align-items: flex-end; gap: 0.6rem;
    padding: 0.75rem 0.875rem;
    border-radius: 16px;
    background: var(--page);
  }
  .caption { text-align: right; }
  .caption { margin: 0; font-size: 0.8125rem; opacity: 0.7; }
  .swatches { display: flex; gap: 0.75rem; }
  .swatches button {
    width: 28px; height: 28px; border-radius: 50%;
    border: 0; padding: 0; cursor: pointer;
    background: var(--c);
    box-shadow: 0 0 0 1px var(--ring);
  }
  .swatches button[aria-pressed="true"] {
    box-shadow: 0 0 0 2px var(--page), 0 0 0 4px var(--ink);
  }
  .swatches button:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }

  @media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>
</head>
<body>
<div class="clouds" id="clouds" aria-hidden="true">
  <div class="band">
    <div class="sky" id="sky"></div>
    <div class="stars" id="stars"><canvas></canvas><canvas></canvas><canvas></canvas></div>
    <div class="moon" id="moon"></div>
  </div>
  <canvas id="cloud-gl"></canvas>
  <div class="sun" id="sun"><i class="rays"></i><i class="glare"></i></div>
  <div class="grain" id="grain"></div>
</div>
<main>
  <h1 class="sr-only">Interactive 3D laptop</h1>

  <div class="stage" id="stage" role="button" tabindex="0" aria-pressed="false"
       aria-label="3D laptop, lid closed. Press Enter or Space to open the lid. Use the arrow keys to rotate.">
    <canvas id="canvas" aria-hidden="true"></canvas>
    <span class="hint" id="hint" aria-hidden="true">Drag to rotate, tap to open</span>
  </div>

  <div class="preview" role="group" aria-label="Preview a time of day">
    <button type="button" data-hour="" aria-pressed="true">Now</button>
    <button type="button" data-hour="6" aria-pressed="false">Dawn</button>
    <button type="button" data-hour="12" aria-pressed="false">Day</button>
    <button type="button" data-hour="17.75" aria-pressed="false">Sunset</button>
    <button type="button" data-hour="23" aria-pressed="false">Night</button>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

      "3D laptop, lid " + (open ? "open" : "closed") + ". Press Enter or Space to " +
      (open ? "close" : "open") + " the lid. Use the arrow keys to rotate.");
    wake();
  }

  function touch() {
    c.lastInput = performance.now();
    c.idleBlend = 0;
    if (hintShown) { hintShown = false; hintEl.setAttribute("data-hidden", "true"); }
    wake();
  }

  stage.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (pointer) return; // one pointer drives; extra fingers are ignored
    var wasSpinning = Math.sqrt(c.vYaw * c.vYaw + c.vTilt * c.vTilt) > 0.4;
    c.vYaw = 0; c.vTilt = 0;
    yawTarget = null;
    pointer = {
      id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY,
      t0: e.timeStamp, tLast: e.timeStamp, vYaw: 0, vTilt: 0, drag: false,
      caught: wasSpinning // a tap that catches a spinning laptop just stops it
    };

  stage.addEventListener("pointermove", function (e) {
    var p = pointer;
    if (!p || e.pointerId !== p.id) return;
    if (!p.drag) {
      var mx = e.clientX - p.x0, my = e.clientY - p.y0;
      if (Math.sqrt(mx * mx + my * my) < TAP_SLOP) return;
      p.drag = true;
      p.x = e.clientX; p.y = e.clientY; p.tLast = e.timeStamp;
      c.dragging = true;
      stage.setAttribute("data-dragging", "true");
      return;
    }
    var dYaw = (e.clientX - p.x) * DRAG_SENS;
    var before = c.tilt;
    c.yaw += dYaw;
    c.tilt = clamp(c.tilt + (e.clientY - p.y) * DRAG_SENS, TILT_MIN, TILT_MAX);
    var dTilt = c.tilt - before;
    var dt = Math.max((e.timeStamp - p.tLast) / 1000, 1 / 240);
    p.vYaw = lerp(p.vYaw, dYaw / dt, 0.5);
    p.vTilt = lerp(p.vTilt, dTilt / dt, 0.5);
    p.x = e.clientX; p.y = e.clientY; p.tLast = e.timeStamp;
    c.lastInput = performance.now();
    wake();
  });

  function endPointer(e, cancelled) {
    var p = pointer;
    if (!p || e.pointerId !== p.id) return;

    if (p.drag) {
      var flick = !cancelled && e.timeStamp - p.tLast < 90;
      c.vYaw = flick ? clamp(p.vYaw, -MAX_SPIN, MAX_SPIN) : 0;
      c.vTilt = flick ? clamp(p.vTilt, -MAX_SPIN, MAX_SPIN) : 0;
      c.dragging = false;
      stage.setAttribute("data-dragging", "false");
    } else if (!cancelled && !p.caught && e.timeStamp - p.t0 < TAP_MS && hitTest(e.clientX, e.clientY)) {
      setOpen(!open);
    }
    c.lastInput = performance.now();
    wake();
  }
  stage.addEventListener("pointerup", function (e) { endPointer(e, false); });
  stage.addEventListener("pointercancel", function (e) { endPointer(e, true); });
  stage.addEventListener("lostpointercapture", function (e) { endPointer(e, true); });

  stage.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (!e.repeat) setOpen(!open);
      touch();
      return;
    }
    var dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!dir) return;
    e.preventDefault();
    yawTarget = null;
    if (reducedMotion) {
      c.yaw += dir[0] * 10 * DEG;
      c.tilt = clamp(c.tilt + dir[1] * 10 * DEG, TILT_MIN, TILT_MAX);
    } else {
      c.vYaw = clamp(c.vYaw + dir[0] * 0.7, -4, 4);
      c.vTilt = clamp(c.vTilt + dir[1] * 0.7, -4, 4);
    }
    touch();
  });

  /* ---------------- colour swatches ---------------- */
  var swatches = document.querySelectorAll(".swatches button");
  Array.prototype.forEach.call(swatches, function (b) {
    b.addEventListener("click", function () {
      Array.prototype.forEach.call(swatches, function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      setColor(b.getAttribute("data-color"));
      document.getElementById("caption").textContent = "Previewing: " + b.getAttribute("data-name").toLowerCase();
    });
  });

  /* ---------------- go ---------------- */
  setColor(PROPS.color);
  if (document.fonts && document.fonts.load) {
    document.fonts.load('120px "Sacramento"').then(function () {
      drawScreen();
      screenTex.needsUpdate = true;
      wake();
    }).catch(function () {});
  }
  wake();
})();
</script>

<script>
/* Sky layer. Clouds are generated every frame in a WebGL shader: layered fractal
   noise with domain warping and a soft threshold, in three depth layers. The sky
   gradient, stars, moon and sun glare are plain page elements behind them.
   Everything follows the device's local time and blends between looks. */
(function () {
  "use strict";
  var root = document.getElementById("clouds");
  var cv = document.getElementById("cloud-gl");
  var skyEl = document.getElementById("sky"), starsEl = document.getElementById("stars");
  var moonEl = document.getElementById("moon"), sunEl = document.getElementById("sun");
  var grainEl = document.getElementById("grain");
  if (!root || !cv) return;

  function hex(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }

  /* ---------- the looks ---------- */
  var LOOKS = {
    day: {
      skyTop: hex("#2F7FDB"), skyLow: hex("#8EC5F2"), skyAngle: 180,
      lit: hex("#FFFFFF"), shade: hex("#D6E4F2"), shade2: hex("#D6E4F2"), rim: hex("#FFFFFF"), haze: hex("#9CCBF3"),
      light: [-0.35, 0.94], lightPos: [0, 1],
      cover: 0.47, scale: 1.3, stretch: 1.15, persp: 1.0, soft: 0.08, billow: 0.6, band: 0, streak: 0, warp: 0.4,
      rimK: 0.15, lightK: 2.2, core: 0.14,
      stars: 0, moon: 0, sun: 1, grain: 0,
      page: hex("#EFF6FD"), ground: hex("#3B6FB0"), shadow: hex("#2C4A70"), body: hex("#DCE8F5"), bodyHi: hex("#FFFFFF"), bodyLo: hex("#9FC0E6")
    },
    sunset: {
      skyTop: hex("#8FA0E8"), skyLow: hex("#F8DDB8"), skyAngle: 215,
      lit: hex("#F7A072"), shade: hex("#F08A8A"), shade2: hex("#9B7FC7"), rim: hex("#FFE27A"), haze: hex("#F6C9B4"),
      light: [-0.8, -0.6], lightPos: [0, 0],
      cover: 0.76, scale: 0.62, stretch: 1.05, persp: 0.3, soft: 0.2, billow: 0.55, band: 0, streak: 0, warp: 0.6,
      rimK: 0.7, lightK: 3.0, core: 0,
      stars: 0, moon: 0, sun: 0, grain: 0,
      page: hex("#FDF2EC"), ground: hex("#B4587A"), shadow: hex("#7A4A7A"), body: hex("#F2A892"), bodyHi: hex("#FFD9A0"), bodyLo: hex("#B08FD0")
    },
    night: {
      skyTop: hex("#0B1A2B"), skyLow: hex("#5C7890"), skyAngle: 150,
      lit: hex("#C9D1D9"), shade: hex("#2A3847"), shade2: hex("#2A3847"), rim: hex("#C9D1D9"), haze: hex("#3F566B"),
      light: [0.6, 0.8], lightPos: [1, 1],
      cover: 0.50, scale: 0.95, stretch: 1.7, persp: 0.5, soft: 0.20, billow: 0.10, band: 1, streak: 1, warp: 1.0,
      rimK: 0.25, lightK: 2.5, core: 0.10,
      stars: 1, moon: 1, sun: 0, grain: 1,
      page: hex("#E9EEF5"), ground: hex("#22324A"), shadow: hex("#0B1420"), body: hex("#627488"), bodyHi: hex("#C9D1D9"), bodyLo: hex("#2A3847")
    },
    dawn: {   // a softer, paler sunset
      skyTop: hex("#AEBBEF"), skyLow: hex("#FBEAD2"), skyAngle: 200,
      lit: hex("#FBC9AC"), shade: hex("#F3B6B6"), shade2: hex("#BCAADB"), rim: hex("#FFEFB4"), haze: hex("#F8DCCB"),
      light: [-0.8, -0.5], lightPos: [0, 0],
      cover: 0.56, scale: 0.80, stretch: 1.3, persp: 0.4, soft: 0.22, billow: 0.45, band: 0, streak: 0, warp: 0.6,
      rimK: 0.6, lightK: 2.4, core: 0.05,
      stars: 0.15, moon: 0.2, sun: 0, grain: 0.2,
      page: hex("#FAF1F4"), ground: hex("#9A78A8"), shadow: hex("#7A6A8A"), body: hex("#ECCFCB"), bodyHi: hex("#FFF0DC"), bodyLo: hex("#B9A9D6")
    }
  };
  // local hour -> look. Day/sunset and sunset/night cross-fade over 40 minutes
  // around 4:30pm and 7pm; dawn is itself the two-hour blend from night to day.
  var STOPS = [[0, "night"], [5, "night"], [6, "dawn"], [7, "day"], [16.17, "day"], [16.83, "sunset"],

      }
    }

  }
  var forcedHour = null;
  function currentHour() {
    if (forcedHour !== null) return forcedHour;

  }

  /* ---------- page elements behind the clouds ---------- */
  function css(c, a) {
    return "rgba(" + Math.round(c[0] * 255) + "," + Math.round(c[1] * 255) + "," + Math.round(c[2] * 255) + "," + (a === undefined ? 1 : a) + ")";
  }
  function toHex(c) {
    var v = (1 << 24) | (Math.round(c[0] * 255) << 16) | (Math.round(c[1] * 255) << 8) | Math.round(c[2] * 255);
    return "#" + v.toString(16).slice(1);
  }
  function applyDom(L) {
    skyEl.style.background = "linear-gradient(" + L.skyAngle.toFixed(1) + "deg, " + css(L.skyTop) + " 0%, " + css(L.skyLow) + " 100%)";
    document.documentElement.style.setProperty("--page", css(L.page));   // the whole page takes a very light tint of the sky
    starsEl.style.opacity = L.stars.toFixed(3);
    moonEl.style.opacity = L.moon.toFixed(3);
    sunEl.style.opacity = L.sun.toFixed(3);
    grainEl.style.opacity = (L.grain * 0.13).toFixed(3);
  }

  function paintStars() {
    var w = root.clientWidth, band = starsEl.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
    var layers = starsEl.querySelectorAll("canvas");
    var count = Math.max(90, Math.min(360, Math.round(w * band / 1500)));
    for (var l = 0; l < layers.length; l++) {
      var c = layers[l];
      c.width = Math.round(w * dpr); c.height = Math.round(band * dpr);
      var ctx = c.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      for (var i = 0; i < count / layers.length; i++) {
        var x = Math.random() * w, y = Math.pow(Math.random(), 1.9) * band * 0.6;   // densest near the top
        var big = Math.random() < 0.12;
        ctx.globalAlpha = big ? 1 : 0.35 + Math.random() * 0.6;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x, y, big ? 1.1 + Math.random() * 0.5 : 0.45 + Math.random() * 0.45, 0, Math.PI * 2);

    g.width = g.height = 128;
    var ctx = g.getContext("2d"), img = ctx.createImageData(128, 128);
    for (var i = 0; i < img.data.length; i += 4) {
      var v = Math.random() * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
    }

    grainEl.style.backgroundSize = "128px 128px";
  }

  /* ---------- the cloud shader ---------- */
  var VERT = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
  var FRAG = [
    "#ifdef GL_FRAGMENT_PRECISION_HIGH",
    "precision highp float;",
    "#else",
    "precision mediump float;",
    "#endif",
    "uniform vec2 uRes; uniform float uTime; uniform float uSplit; uniform float uAspect;",
    "uniform float uCover; uniform float uScale; uniform float uStretch; uniform float uPersp; uniform float uSoft;",
    "uniform float uBillow; uniform float uBand; uniform float uStreak; uniform float uRimK; uniform float uLightK;",
    "uniform float uCore; uniform float uShadowA; uniform float uWarp;",
    "uniform vec2 uLight; uniform vec2 uLightPos;",
    "uniform vec3 uLit; uniform vec3 uShade; uniform vec3 uShade2; uniform vec3 uRim; uniform vec3 uHaze; uniform vec3 uShadowC;",
    "float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }",
    "float noise(vec2 p){",
    "  vec2 i = floor(p), f = fract(p);",
    "  vec2 u = f * f * (3.0 - 2.0 * f);",
    "  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);",
    "}",
    // five octaves; x = smooth fBm, y = billowy fBm (rounded cauliflower bumps)
    "vec2 fb(vec2 p){",
    "  float a = 0.5; vec2 v = vec2(0.0);",
    "  for (int i = 0; i < 5; i++) { float n = noise(p); v += a * vec2(n, abs(2.0 * n - 1.0)); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }",
    "  return vec2(v.x, v.y * 1.55);",
    "}",
    "float fb3(vec2 p){",
    "  float a = 0.5; float v = 0.0;",
    "  for (int i = 0; i < 3; i++) { v += a * noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }",
    "  return v;",
    "}",
    // night: a loose diagonal band from middle left to bottom right
    "float bandTerm(vec2 uvb){ return uBand * (0.22 - smoothstep(0.0, 0.5, abs(uvb.y - (0.75 - 0.4 * uvb.x))) * 0.6); }",
    "vec2 layerPos(vec2 base, float sc, float speed, float seed){",
    "  vec2 p = base * sc; p.x /= uStretch; p.x -= uTime * speed * sc; return p + seed;",
    "}",
    "vec4 cloudLayer(vec2 base, vec2 uvb, float sc, float speed, float covAdd, float bias, float haze, float op, float seed){",
    "  vec2 p = layerPos(base, sc, speed, seed);",
    // domain warp, itself drifting slowly so the shapes keep changing
    "  vec2 q = vec2(fb3(p * 0.7 + vec2(0.0, uTime * 0.012)), fb3(p * 0.7 + vec2(5.2, 1.3 - uTime * 0.009)));",
    "  vec2 pw = p + (q - 0.5) * uWarp;",
    "  vec2 f = fb(pw);",
    "  float n = mix(f.x, f.y, uBillow);",
    "  float cov = clamp(uCover + covAdd + bias * (uvb.y - 0.5) * uPersp + bandTerm(uvb), 0.0, 1.0);",
    "  float thr = mix(0.80, 0.28, cov);",
    "  float d = smoothstep(thr, thr + uSoft, n);",          // soft threshold
    "  if (d <= 0.0) return vec4(0.0);",
    "  float facing = (fb3(pw) - fb3(pw + uLight * 0.14)) * uLightK;", // thinner toward the light = lit side
    "  float l = clamp(0.6 + facing + dot(uvb - 0.5, uLight) * 0.3, 0.0, 1.0);",
    "  l *= 1.0 - uCore * smoothstep(thr + uSoft, thr + uSoft + 0.35, n);",
    "  float far = clamp(distance(uvb, uLightPos) * 0.9 - 0.15, 0.0, 1.0);",
    "  vec3 c = mix(mix(uShade, uShade2, far), uLit, l);",    // far side cooler, lit side warmer
    "  float edge = 4.0 * d * (1.0 - d);",
    "  c = mix(c, uRim, clamp(uRimK * edge * (0.25 + facing * 3.0), 0.0, 1.0));", // glowing thin edges

    "}",

    "  vec2 uv = gl_FragCoord.xy / uRes;",
    "  if (uv.y < uSplit) {",
    // below the band: a faint, blurred shadow of the nearest cloud layer
    "    float sv = uv.y / uSplit;",
    "    vec2 uvb = vec2(uv.x, sv);",
    "    float s = 1.0 + uPersp * (1.0 - sv) * 0.25;",
    "    vec2 base = vec2((uv.x - 0.5) * uAspect, sv - 1.0) * s;",
    "    vec2 p = layerPos(base, uScale, 0.05, 0.0);",
    "    float thr = mix(0.80, 0.28, clamp(uCover + bandTerm(uvb), 0.0, 1.0));",
    "    float a = smoothstep(thr - 0.12, thr + 0.3, fb3(p)) * uShadowA * smoothstep(0.0, 0.35, sv) * smoothstep(1.05, 0.7, sv);",

    "  float v = (uv.y - uSplit) / (1.0 - uSplit);",        // 0 at the bottom of the band, 1 at the top
    "  vec2 uvb = vec2(uv.x, v);",
    "  float s = 1.0 + uPersp * (1.0 - v) * 0.25;",          // slightly smaller lower down
    "  vec2 base = vec2((uv.x - 0.5) * uAspect, v - 1.0) * s;",
    "  vec4 col = vec4(0.0);",
    // night: thin flat streaks near the bottom
    "  float ns = fb3(vec2(base.x * 0.5 - uTime * 0.012, v * 15.0));",
    "  float st = smoothstep(0.5, 0.72, ns) * smoothstep(0.7, 0.3, v) * uStreak * 0.6;",
    "  col = vec4(mix(uShade, uLit, 0.45) * st, st);",
    "  vec4 L;",
    "  L = cloudLayer(base, uvb, uScale * 2.7, 0.020, -0.06, -0.5, 0.45, 0.75, 31.7); col = col * (1.0 - L.a) + L;", // far
    "  L = cloudLayer(base, uvb, uScale * 1.7, 0.032, -0.04, -0.1, 0.20, 0.90, 12.3); col = col * (1.0 - L.a) + L;", // middle
    "  L = cloudLayer(base, uvb, uScale,       0.050,  0.00, 0.45, 0.00, 1.00, 0.0);  col = col * (1.0 - L.a) + L;", // near
    "  gl_FragColor = col * smoothstep(0.12, 0.66, v);",      // sit high and dissolve well above the content
    "}"
  ].join("\n");

  var gl = null;

  var U = {}, glReady = false;

    var compile = function (type, src) {
      var sh = gl.createShader(type);
      gl.shaderSource(sh, src); gl.compileShader(sh);

    };

      if (gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        gl.useProgram(prog);
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        var loc = gl.getAttribLocation(prog, "p");
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        ["uRes", "uTime", "uSplit", "uAspect", "uCover", "uScale", "uStretch", "uPersp", "uSoft", "uBillow", "uBand", "uStreak",
         "uRimK", "uLightK", "uCore", "uShadowA", "uWarp", "uLight", "uLightPos", "uLit", "uShade", "uShade2", "uRim", "uHaze", "uShadowC"]
          .forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });
        glReady = true;
      }
    }
  }
  if (!glReady) cv.style.display = "none";   // the sky, stars, moon and sun still show
  cv.addEventListener("webglcontextlost", function (e) { e.preventDefault(); glReady = false; cv.style.display = "none"; });

  var SPLIT = 1 - 1 / 2.3;        // share of the canvas below the band (shadow zone)
  var quality = 1;                // lowered automatically if frames run slow
  function resize() {
    var w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (!w || !h) return;
    // clouds are soft, so a modest pixel budget is plenty and keeps every device at full frame rate
    var scale = Math.min(1, Math.sqrt(320000 / (w * dpr * h * dpr))) * dpr * quality;
    var bw = Math.max(64, Math.round(w * scale)), bh = Math.max(64, Math.round(h * scale));
    if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; gl.viewport(0, 0, bw, bh); }
  }

  /* ---------- run ---------- */
  var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
  var goal = lookAt(currentHour()), shown = goal;
  var raf = 0, last = 0, clock = 40, slowAvg = 16, frames = 0, settled = false;

  function draw(t) {
    raf = 0;
    var dt = last ? Math.min((t - last) / 1000, 0.1) : 0.016;
    var rawDt = last ? t - last : 16;
    last = t;
    if (!mq.matches) clock += dt;

    // ease toward the goal look so nothing switches abruptly
    if (!settled) {
      var k = mq.matches ? 1 : 1 - Math.exp(-dt * 2.2);
      shown = mixLook(shown, goal, k);
      settled = Math.abs(shown.cover - goal.cover) + Math.abs(shown.skyTop[0] - goal.skyTop[0]) +
                Math.abs(shown.skyTop[2] - goal.skyTop[2]) + Math.abs(shown.stars - goal.stars) + Math.abs(shown.sun - goal.sun) < 0.004;
      if (settled) shown = goal;
      applyDom(shown);
    }

    if (glReady) {
      resize();
      var L = shown;
      gl.uniform2f(U.uRes, cv.width, cv.height);
      gl.uniform1f(U.uTime, clock);
      gl.uniform1f(U.uSplit, SPLIT);
      gl.uniform1f(U.uAspect, cv.width / (cv.height * (1 - SPLIT)));
      gl.uniform1f(U.uCover, L.cover); gl.uniform1f(U.uScale, L.scale); gl.uniform1f(U.uStretch, L.stretch);
      gl.uniform1f(U.uPersp, L.persp); gl.uniform1f(U.uSoft, L.soft); gl.uniform1f(U.uBillow, L.billow);
      gl.uniform1f(U.uBand, L.band); gl.uniform1f(U.uStreak, L.streak); gl.uniform1f(U.uRimK, L.rimK);
      gl.uniform1f(U.uLightK, L.lightK); gl.uniform1f(U.uCore, L.core); gl.uniform1f(U.uShadowA, 0.07); gl.uniform1f(U.uWarp, L.warp);
      gl.uniform2f(U.uLight, L.light[0], L.light[1]); gl.uniform2f(U.uLightPos, L.lightPos[0], L.lightPos[1]);
      gl.uniform3fv(U.uLit, L.lit); gl.uniform3fv(U.uShade, L.shade); gl.uniform3fv(U.uShade2, L.shade2);
      gl.uniform3fv(U.uRim, L.rim); gl.uniform3fv(U.uHaze, L.haze); gl.uniform3fv(U.uShadowC, L.shadow);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      // if this device cannot hold the frame rate, render fewer pixels rather than stutter
      if (rawDt < 250) {
        slowAvg += (rawDt - slowAvg) * 0.08;
        if (++frames > 50 && slowAvg > 22 && quality > 0.3 && !window.__skyHoldQuality) { quality *= 0.7; frames = 0; slowAvg = 16; }
      }
    }
    // with reduced motion the sky holds still, so stop once it has settled
    if (!(mq.matches && settled)) loop();
  }
  function loop() { if (!raf) raf = requestAnimationFrame(draw); }

  function retarget() {
    goal = lookAt(currentHour());
    settled = false;
    if (window.__setLaptopSky) {
      try { window.__setLaptopSky(toHex(goal.body), toHex(goal.bodyHi), toHex(goal.bodyLo), toHex(goal.ground)); } catch (e) {}
    }
    loop();
  }

  var buttons = document.querySelectorAll(".preview button");
  Array.prototype.forEach.call(buttons, function (b) {
    b.addEventListener("click", function () {
      Array.prototype.forEach.call(buttons, function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      var h = b.getAttribute("data-hour");
      forcedHour = h === "" ? null : parseFloat(h);
      retarget();
    });
  });
  window.__setSkyHour = function (h) { forcedHour = h; retarget(); };

  var resizeTimer = 0;
  window.addEventListener("resize", function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { paintStars(); loop(); }, 150); });
  if (mq.addEventListener) mq.addEventListener("change", loop);
  document.addEventListener("visibilitychange", function () { last = 0; });

  document.documentElement.setAttribute("data-theme", "light");   // the tinted page is always light, so keep dark text
  paintStars();
  paintGrain();
  applyDom(shown);
  retarget();
  setInterval(retarget, 30000);
})();
</script>
